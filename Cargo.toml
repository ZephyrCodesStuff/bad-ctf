[package]
name = "ybox-cfw"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

embassy-stm32 = { version = "0.6.0", features = ["stm32f103c8", "defmt", "time-driver-any", "memory-x", "unstable-pac", "exti"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

panic-probe = "1.0.0"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embedded-graphics = "0.8"

[profile.dev]
opt-level = "z"
debug = 2
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
# debug = 2
lto = true
codegen-units = 1
